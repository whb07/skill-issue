schema_version: "1.1"
name: check-then-act-race
expected_outcome: |
  Finds that reserve now reads stock, checks it, and writes an absolute value
  in separate autocommit statements, so concurrent checkouts (8 workers x 4
  threads) can both pass the check and oversell or lose an update. Gives a
  concrete interleaving and recommends an atomic conditional UPDATE
  (optionally with RETURNING) or SELECT ... FOR UPDATE in a transaction.
  Ideally also notes that an unknown SKU now raises TypeError instead of
  OutOfStock.
context:
  scaffold_script: place-files.sh
