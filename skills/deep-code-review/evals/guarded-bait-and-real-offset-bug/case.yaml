schema_version: "1.1"
name: guarded-bait-and-real-offset-bug
expected_outcome: |
  Finds that list_orders uses offset = page * page_size although page is
  1-based, so page 1 skips the newest page_size orders. Does not report the
  f-string ORDER BY as SQL injection, because the only caller passes a column
  from the sort_column allowlist. Does not report user.addresses[0] as a
  possible IndexError, because User guarantees at least one address.
context:
  scaffold_script: place-files.sh
